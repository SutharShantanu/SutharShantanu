name: Update YouTube Music Playback

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch:      # Allows manual one-click trigger in GitHub Actions

jobs:
  update-music:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ytmusicapi

      - name: Update README with YouTube Music tracks
        env:
          YTMUSIC_AUTH: ${{ secrets.YTMUSIC_AUTH }}
        run: python .github/scripts/update_ytmusic.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes in YouTube Music history."
          else
            git commit -m "chore(music): update YouTube Music playback history"
            git push
          fi
